<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音频与寄语</title>
<style>
  :root {
    --bg: #fafafa; --card: #fff; --text: #1a1a1a;
    --muted: #6b6b6b; --line: #e6e6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101012; --card: #18181b; --text: #ededed;
      --muted: #9a9a9a; --line: #2a2a2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 28px; letter-spacing: .01em; }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px 20px;
    margin-bottom: 18px;
  }
  h2 {
    font-size: 13px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
    margin: 0 0 14px;
  }
  audio { width: 100%; display: block; }
  .message {
    margin: 16px 0 0;
    font-size: 15px;
    color: var(--text);
    line-height: 1.7;
  }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>

<main>
  <h1>做一个像树一样的人！</h1>

  <section>
    <h2>播放</h2>
    <audio controls preload="metadata" src="media/audio.mp3">
      你的浏览器不支持音频播放。
    </audio>
    <p class="message">文学作品中，树常常被用来比喻静默奉献的人物。而在听这首歌时，我惊觉，心怀苍生却命运坎坷的圣人，这是我最喜欢的小说人设之一，不就是树一样的人吗？温柔而强大，沉默而宽容。我想能成为这样的人一定都很伟大，不仅内心坚定充实，而且能做到知行合一。但往往遇到这样顶顶好的人，我的内心总是有一股难以言说的痛苦，我想，是由于成为这样的人太难太苦的缘故吧。（有感而发，想到你每次打开都会看到，不禁感到羞涩）
    </p>
  </section>

  <footer>© 2026 lxw happy everyday</footer>
</main>

</body>
</html>
